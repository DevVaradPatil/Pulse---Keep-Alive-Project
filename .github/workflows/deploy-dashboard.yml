name: deploy-dashboard

# Publishes dashboard/ to GitHub Pages. There is no build step: the dashboard is
# vanilla HTML, CSS and JS. The only generated file is config.js, which carries
# the repository slug so the page knows where to fetch history.json from - that
# way nothing in the repository has to hardcode your username.
#
# The dashboard reads its data at run time from the status branch, so a new
# heartbeat needs no redeploy. This only runs when the dashboard itself changes.
#
# OFF BY DEFAULT. GitHub Pages needs a PUBLIC repository on the Free plan, and
# the page it publishes is public whatever the repository's visibility - it
# fetches history.json from raw.githubusercontent.com, which also requires the
# repo to be public. So publishing the dashboard means publishing your project
# names, platforms and URLs. Opt in only if that is what you want:
#
#   Settings -> Secrets and variables -> Actions -> Variables
#   PULSE_PUBLISH_DASHBOARD = true
#
# On a private repository, use the local dashboard instead - same page, same
# data, nothing published:  npm run dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ vars.PULSE_PUBLISH_DASHBOARD == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate dashboard/config.js from the repository context
        run: |
          set -euo pipefail
          cat > dashboard/config.js <<EOF
          // Generated by .github/workflows/deploy-dashboard.yml - do not edit.
          window.PULSE_CONFIG = {
            repo: '${GITHUB_REPOSITORY}',
            branch: 'status',
            path: 'status/history.json',
            refreshMs: 300000,
          };
          EOF
          cat dashboard/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deployment
        uses: actions/deploy-pages@v4
