name: validate

# Runs on every push and pull request. The point is that it must be impossible
# to break the monitoring by adding a project carelessly: a bad targets.json
# fails here, in a pull request, rather than silently monitoring nothing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Validate config/targets.json
        run: node src/tools/validate-config.js

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Type-check (JSDoc + checkJs)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Fails if the scheduled workflows would exceed a private repository's
      # 2,000 free minutes. Catches an over-eager cron change in review rather
      # than halfway through a month when Actions stops running.
      - name: Scheduled Actions minutes fit the free budget
        run: npm run estimate

      # Proves the whole path end to end without a single network request or a
      # single secret: parse, validate, resolve, plan.
      - name: Dry run against the real config
        run: node src/run.js --dry-run --skip-secrets

      - name: Dry run against the test fixture
        run: node src/run.js --dry-run --skip-secrets --config test/fixtures/targets.fixture.json

      # Proves the hidden-config path still parses and validates. It uses the
      # fixture, never the real PULSE_TARGETS_JSON secret: validation runs on
      # pull requests, and a pull request must never be handed the target list.
      - name: Dry run with the target list supplied as a secret
        run: |
          PULSE_TARGETS_JSON="$(cat test/fixtures/targets.fixture.json)" \
            node src/run.js --dry-run --skip-secrets
